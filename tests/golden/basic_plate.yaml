# Config determinístico para tests de "golden file" (comparar el export
# contra los archivos de referencia basic_plate.mol2/.gro, ya generados y
# revisados). Es determinístico porque prob_oh=100 + fraction=1.0 + z_mode
# fijo no dependen de la semilla del random. Ver test_golden.py.

plate:
  width: 40
  height: 40
  factor: 1.0

oxidation:
  - expression: ""
    fraction: 1.0
    prob_oh: 100
    z_mode: "+z"

export:
  formats: [mol2]
  output_dir: /tmp/graphenegui_golden
  name: basic_plate
