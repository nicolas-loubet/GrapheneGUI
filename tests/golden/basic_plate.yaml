# Config determinístico, pensado para tests de "golden file" (comparar el
# export contra un archivo de referencia ya generado y revisado a mano).
# Por ahora es solo el config de ejemplo — la comparación en sí todavía no
# está armada, ver TODO.

plate:
  width: 40
  height: 40
  factor: 1.0

oxidation:
  - expression: ""
    fraction: 1.0
    prob_oh: 100
    z_mode: "+z"

export:
  formats: [mol2]
  output_dir: /tmp/graphenegui_golden
  name: basic_plate
